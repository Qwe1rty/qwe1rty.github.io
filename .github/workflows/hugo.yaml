# Hugo build & deploy for GitHub Pages.
#
# DRAFT MODE: manual-trigger only (workflow_dispatch) so pushes don't run it yet.
#
# Go-live checklist:
#   1. Uncomment the `push` trigger below.
#   2. Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   3. Push to main. The site goes live at https://qwe1rty.github.io/ (public).
#
# Notes:
#   - Dart Sass is not installed here: the theme uses plain CSS.
#   - Node.js step not needed: no package.json / package-lock.json in this repo.
#   - Go install is conditional (only if go.mod exists, e.g. when using Hugo Modules).
#   - Template steps that are provably inert for this repo are omitted: git history
#     is already full at checkout (fetch-depth: 0), submodules are covered by the
#     checkout input, and the image cache isn't worth it for a site this small
#     (re-add cache restore/save + --cacheDir per gohugo.io docs if it grows).
name: Build and deploy
env:
  HUGO_VERSION: 0.169.0
  GO_VERSION: 1.27.3
  TZ: Etc/UTC
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."
          hugo version || true

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Build
        run: |
          echo "Building the project..."
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
